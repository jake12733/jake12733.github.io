            bizType: currentUser.bizType || DEFAULT_COMPANY.bizType,
            bizItem: currentUser.bizItem || DEFAULT_COMPANY.bizItem,

            tel: DEFAULT_COMPANY.tel

          setInvoices([]);
          setMyCompany(DEFAULT_COMPANY);

      useEffect(() => {
        if (currentUser) {

      const totalPurchaseGrand = totalPurchaseSupply + totalPurchaseTax;

                type="button"
                onClick={handleDemoLogin}
                className="w-full py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg text-xs font-bold transition-colors cursor-pointer border border-blue-200"
              >
                ⚡ 1초 간편 체험 로그인 (김민준 대표 계정)
              </button>
            </div>
          </div>
        </div>
      );
    }

    // 세금계산서 작성 폼 컴포넌트
    function InvoiceForm({ kind, myCompany, counterparties, onSave, onCancel }) {
      const [buyer, setBuyer] = useState(counterparties[0]);
      const [itemDesc, setItemDesc] = useState('');
      const [qty, setQty] = useState(1);
      const [unitPrice, setUnitPrice] = useState(0);

      const supply = qty * unitPrice;
      const tax = Math.round(supply * 0.1);
      const grand = supply + tax;

      const handleSubmit = () => {
        if (!itemDesc.trim()) { alert('품목명을 입력해 주세요.'); return; }
        const newInvoice = {
          id: `inv-${Date.now()}`,
          manageNumber: `20261022-41000001-${Math.floor(10000000 + Math.random() * 90000000)}`,
          type: 'general',
          kind,
          writeDate: new Date().toISOString().slice(0, 10),
          supplier: kind === 'sales' ? myCompany : buyer,
          buyer: kind === 'sales' ? buyer : myCompany,
          items: [{ id: '1', date: '10-22', name: itemDesc, spec: '', qty, unitPrice, supplyAmount: supply, taxAmount: tax, remark: '' }],
          totalSupplyAmount: supply,
          totalTaxAmount: tax,
          grandTotal: grand,
          cash: 0, check: 0, promissoryNote: 0, receivable: grand,
          purpose: 'claim',
          status: 'issued',
        };
        onSave(newInvoice);
      };

      return (
        <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-2xs space-y-6 max-w-3xl mx-auto">
          <div className="flex justify-between items-center pb-4 border-b border-slate-200">
            <h2 className="text-lg font-bold text-slate-900">
              {kind === 'sales' ? '매출 세금계산서 작성' : '매입 세금계산서 등록'}
            </h2>
            <button onClick={onCancel} className="text-slate-400 hover:text-slate-600 cursor-pointer">닫기</button>
          </div>

          <div className="grid grid-cols-2 gap-4 text-xs">
            <div>
              <label className="block text-slate-500 mb-1 font-semibold">거래처 선택</label>
              <select onChange={e => setBuyer(counterparties.find(c => c.id === e.target.value))} className="w-full p-2 border border-slate-300 rounded-lg">
                {counterparties.map(c => <option key={c.id} value={c.id}>{c.companyName} ({c.bizNumber})</option>)}
              </select>
            </div>
            <div>
              <label className="block text-slate-500 mb-1 font-semibold">작성일자</label>
              <input type="date" defaultValue="2026-10-22" className="w-full p-2 border border-slate-300 rounded-lg" />
            </div>
          </div>

          <div className="space-y-3 text-xs">
            <h3 className="font-bold text-slate-800">품목 정보</h3>
            <div className="grid grid-cols-4 gap-3">
              <div className="col-span-2">
                <label className="block text-slate-500 mb-1">품목명</label>
                <input value={itemDesc} onChange={e => setItemDesc(e.target.value)} placeholder="예: 유지보수 컨설팅 용역" className="w-full p-2 border border-slate-300 rounded-lg" />
              </div>
              <div>
                <label className="block text-slate-500 mb-1">수량</label>
                <input type="number" value={qty} onChange={e => setQty(Number(e.target.value))} className="w-full p-2 border border-slate-300 rounded-lg font-mono text-center" />
              </div>
              <div>
                <label className="block text-slate-500 mb-1">단가 (원)</label>
                <input type="number" value={unitPrice} onChange={e => setUnitPrice(Number(e.target.value))} className="w-full p-2 border border-slate-300 rounded-lg font-mono text-right" />
              </div>
            </div>
          </div>

          <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
            <div>공급가액: <strong className="font-mono text-sm ml-1">₩ {formatCurrency(supply)}</strong></div>
            <div>세액 (10%): <strong className="font-mono text-sm ml-1 text-red-600">₩ {formatCurrency(tax)}</strong></div>
            <div>총 합계금액: <strong className="font-mono text-base ml-1 text-blue-700">₩ {formatCurrency(grand)}</strong></div>
          </div>

          <div className="flex justify-end gap-2 pt-2">
            <button onClick={onCancel} className="px-4 py-2 border border-slate-300 rounded-lg text-xs font-semibold cursor-pointer">취소</button>
            <button onClick={handleSubmit} className="px-5 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-bold cursor-pointer">발행 및 저장</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
