            email: currentUser.email,
            tel: DEFAULT_COMPANY.tel

          setInvoices([]);
          setMyCompany(DEFAULT_COMPANY);

              <div className="relative overflow-hidden rounded-2xl border-2 border-dashed border-slate-300 bg-gradient-to-r from-slate-50 via-slate-100/60 to-slate-50 p-6 text-center shadow-2xs hover:border-blue-400 transition-colors">
                <div className="absolute top-2.5 left-3 flex items-center gap-1.5">
                  <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 bg-white px-2 py-0.5 rounded border border-slate-200">
                    SPONSORED AD
                  </span>
                </div>
                <div className="py-2 flex flex-col items-center justify-center space-y-1">
                  <div className="flex items-center gap-2 text-slate-500 font-medium text-xs sm:text-sm">
                    <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z" />
                    </svg>
                    <span>하단 가로형 배너 광고 영역 (728×90 / 970×90 / 반응형)</span>
                  </div>
                  <p className="text-[11px] text-slate-400">
                    구글 애드센스(Google AdSense) 또는 카카오 애드핏(Kakao AdFit) 수평 디스플레이 광고 슬롯입니다.
                  </p>
                </div>
              </div>
            </div>

          </main>

          {/* [AD SLOT: RIGHT WING BANNER (160x600)] 우측 윙 광고 배너 */}
          <aside aria-label="우측 광고 배너" className="hidden 2xl:block w-[160px] shrink-0 self-start sticky top-24 no-print">
            <div className="w-[160px] h-[600px] rounded-2xl border-2 border-dashed border-slate-300 bg-gradient-to-b from-slate-50 via-slate-100/70 to-slate-50 p-3.5 flex flex-col justify-between items-center text-center shadow-2xs hover:border-blue-400 transition-colors">
              <div className="w-full flex items-center justify-between pb-2 border-b border-slate-200">
                <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 bg-white px-1.5 py-0.5 rounded border border-slate-200">AD</span>
                <span className="text-[10px] font-mono text-slate-400">160 × 600</span>
              </div>
              <div className="space-y-2 py-4">
                <div className="w-10 h-10 mx-auto rounded-xl bg-slate-200/80 flex items-center justify-center text-slate-400">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                </div>
                <div className="text-xs font-bold text-slate-600">우측 윙 광고</div>
                <p className="text-[11px] text-slate-400 leading-tight">스카이스크래퍼 세로형 디스플레이 광고 영역</p>
              </div>
              <div className="w-full pt-2 border-t border-slate-200 text-[10px] text-slate-400 font-mono">AdSense / AdFit</div>
            </div>
          </aside>
        </div>

          {/* 3. 로그인 및 회원가입 모달 */}
          {authModalOpen && (
            <AuthModal
              mode={authMode}
              setMode={setAuthMode}
              onClose={() => setAuthModalOpen(false)}
              onSuccess={handleLoginSuccess}
            />
          )}

          {/* 4. 국세청 표준 제11호 서식 상세 보기 모달 */}
          {viewingInvoice && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-4xl w-full p-6 shadow-2xl border border-slate-200 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center pb-3 border-b border-slate-200">
                  <div className="font-bold text-lg text-slate-900">전자세금계산서 상세 (국세청 별지 제11호 서식)</div>
                  <div className="flex gap-2">
                    <button onClick={() => window.print()} className="px-3 py-1.5 text-xs font-bold border border-slate-300 rounded-lg hover:bg-slate-50 cursor-pointer">인쇄 / PDF 저장</button>
                    <button onClick={() => setViewingInvoice(null)} className="px-3 py-1.5 text-xs font-bold bg-slate-100 rounded-lg hover:bg-slate-200 cursor-pointer">닫기</button>
                  </div>
                </div>

                <div id="printable-modal" className="border-2 border-red-500 p-4 rounded-xl space-y-3 text-xs bg-white">
                  <div className="flex justify-between items-center border-b-2 border-red-500 pb-2">
                    <span className="font-mono text-slate-500">승인번호: {viewingInvoice.manageNumber}</span>
                    <h2 className="text-xl font-black text-red-600">세 금 계 산 서 <span className="text-xs text-red-500">(공급자 보관용)</span></h2>
                    <span className="text-slate-400">관리번호: {viewingInvoice.id}</span>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div className="border border-red-300 p-2 rounded bg-red-50/20">
                      <div className="font-bold text-red-600 mb-1">[공급자]</div>
                      <div>상호: {viewingInvoice.supplier.companyName}</div>
                      <div>사업자번호: <strong className="font-mono">{viewingInvoice.supplier.bizNumber}</strong></div>
                      <div>대표자: {viewingInvoice.supplier.ceoName}</div>
                      <div>주소: {viewingInvoice.supplier.address}</div>
                    </div>
                    <div className="border border-blue-300 p-2 rounded bg-blue-50/20">
                      <div className="font-bold text-blue-600 mb-1">[공급받는자]</div>
                      <div>상호: {viewingInvoice.buyer.companyName}</div>
                      <div>사업자번호: <strong className="font-mono">{viewingInvoice.buyer.bizNumber}</strong></div>
                      <div>대표자: {viewingInvoice.buyer.ceoName}</div>
                      <div>주소: {viewingInvoice.buyer.address}</div>
                    </div>
                  </div>

                  <div className="bg-slate-50 p-2.5 rounded border border-slate-200 flex justify-between font-mono font-bold">
                    <span>작성일자: {viewingInvoice.writeDate}</span>
                    <span>공급가액: ₩ {formatCurrency(viewingInvoice.totalSupplyAmount)}</span>
                    <span className="text-red-600">세액: ₩ {formatCurrency(viewingInvoice.totalTaxAmount)}</span>
                    <span className="text-blue-700 text-sm">합계: ₩ {formatCurrency(viewingInvoice.grandTotal)}</span>
                  </div>

                  <table className="w-full text-center border-collapse border border-slate-200 text-[11px]">
                    <thead className="bg-slate-100 font-bold">
                      <tr>
                        <th className="border p-1.5">품목</th>
                        <th className="border p-1.5 w-16">수량</th>
                        <th className="border p-1.5 w-24">단가</th>
                        <th className="border p-1.5 w-28">공급가액</th>
                        <th className="border p-1.5 w-24">세액</th>
                      </tr>
                    </thead>
                    <tbody>
                      {viewingInvoice.items.map(item => (
                        <tr key={item.id}>
                          <td className="border p-1.5 text-left">{item.name}</td>
                          <td className="border p-1.5">{item.qty}</td>
                          <td className="border p-1.5 text-right font-mono">{formatCurrency(item.unitPrice)}</td>
                          <td className="border p-1.5 text-right font-mono font-bold">{formatCurrency(item.supplyAmount)}</td>
                          <td className="border p-1.5 text-right font-mono text-red-600">{formatCurrency(item.taxAmount)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* 5. 공인인증서 전자서명 모달 */}
          {signingInvoice && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl border border-slate-200">
                <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">
                  ✓
                </div>
                <h3 className="text-base font-bold text-slate-900">공동인증서(전자서명) 발급</h3>
                <p className="text-xs text-slate-500">인증서 전자서명을 수행하고 국세청 홈택스 시스템으로 즉시 전송합니다.</p>
                <div className="p-3 bg-slate-50 rounded-lg text-left text-xs space-y-1 border border-slate-200">
                  <div>인증기관: 한국정보인증(KICA)</div>
                  <div>발급대상: {myCompany.companyName}</div>
                  <div>유효기간: 2026-10-22 ~ 2027-10-22</div>
                </div>
                <div className="flex gap-2">
                  <button onClick={() => setSigningInvoice(null)} className="flex-1 py-2 text-xs font-bold bg-slate-100 rounded-lg cursor-pointer">취소</button>
                  <button onClick={handleCompleteSign} className="flex-1 py-2 text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white rounded-lg cursor-pointer">서명 및 전송</button>
                </div>
              </div>
            </div>
          )}

          {/* 토스트 메시지 */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-lg border border-slate-700">
              {toast}
            </div>
          )}
        </div>
      );
    }

    // 로그인 / 회원가입 모달
    function AuthModal({ mode, setMode, onClose, onSuccess }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [name, setName] = useState('');
      const [companyName, setCompanyName] = useState('');
      const [bizNumber, setBizNumber] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (mode === 'login') {
          if (!email || !password) {
            alert('이메일과 비밀번호를 입력해 주세요.');
            return;
          }
          onSuccess({
            name: name || '홍길동 대표',
            email: email,
            companyName: companyName || '(주)한국상사',
            bizNumber: bizNumber || '120-88-12345'
          });
        } else {
          if (!name || !companyName || !bizNumber || !email || !password) {
            alert('모든 필수 항목을 입력해 주세요.');
            return;
          }
          onSuccess({
            name,
            email,
            companyName,
            bizNumber
          });
        }
      };

      const handleDemoLogin = () => {
        onSuccess({
          name: '김민준 대표',
          email: 'tax@nextcore.co.kr',
          companyName: '(주)넥스트코어솔루션',
          bizNumber: '214-88-92140',
          address: '서울특별시 강남구 테헤란로 152, 14층',
          bizType: '정보통신업',
          bizItem: '소프트웨어 개발 및 IT컨설팅'
        });
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-5">
            <div className="flex justify-between items-center border-b border-slate-100 pb-3">
              <div className="flex gap-4">
                <button
                  type="button"
                  onClick={() => setMode('login')}
                  className={`text-sm font-bold pb-1 cursor-pointer ${mode === 'login' ? 'text-slate-900 border-b-2 border-slate-900' : 'text-slate-400'}`}
                >
                  로그인
                </button>
                <button
                  type="button"
                  onClick={() => setMode('signup')}
                  className={`text-sm font-bold pb-1 cursor-pointer ${mode === 'signup' ? 'text-slate-900 border-b-2 border-slate-900' : 'text-slate-400'}`}
                >
                  회원가입
                </button>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-sm">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              {mode === 'signup' && (
                <>
                  <div>
                    <label className="block text-slate-600 font-semibold mb-1">대표자 성명</label>
                    <input
                      type="text"
                      placeholder="예: 홍길동"
                      value={name}
                      onChange={e => setName(e.target.value)}
                      className="w-full p-2.5 border border-slate-300 rounded-lg outline-none focus:border-slate-900"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-600 font-semibold mb-1">상호 (법인명)</label>
                    <input
                      type="text"
                      placeholder="예: (주)한국상사"
                      value={companyName}
                      onChange={e => setCompanyName(e.target.value)}
                      className="w-full p-2.5 border border-slate-300 rounded-lg outline-none focus:border-slate-900"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-600 font-semibold mb-1">사업자등록번호</label>
                    <input
                      type="text"
                      placeholder="예: 120-88-12345"
                      value={bizNumber}
                      onChange={e => setBizNumber(e.target.value)}
                      className="w-full p-2.5 border border-slate-300 rounded-lg font-mono outline-none focus:border-slate-900"
                    />
                  </div>
                </>
              )}

              <div>
                <label className="block text-slate-600 font-semibold mb-1">이메일 주소</label>
                <input
                  type="email"
                  placeholder="name@company.com"
                  value={email}
                  onChange={e => setEmail(e.target.value)}
                  className="w-full p-2.5 border border-slate-300 rounded-lg outline-none focus:border-slate-900 font-mono"
                />
              </div>

              <div>
                <label className="block text-slate-600 font-semibold mb-1">비밀번호</label>
                <input
                  type="password"
                  placeholder="••••••••"
                  value={password}
                  onChange={e => setPassword(e.target.value)}
                  className="w-full p-2.5 border border-slate-300 rounded-lg outline-none focus:border-slate-900 font-mono"
                />
              </div>

              <button
                type="submit"
                className="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-lg font-bold text-xs transition-colors cursor-pointer mt-2"
              >
                {mode === 'login' ? '로그인' : '사업자 회원가입'}
              </button>
            </form>

            <div className="border-t border-slate-100 pt-3 space-y-2">
              <button
                type="button"
                onClick={handleDemoLogin}
                className="w-full py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg text-xs font-bold transition-colors cursor-pointer border border-blue-200"
              >
                ⚡ 1초 간편 체험 로그인 (김민준 대표 계정)
              </button>
            </div>
          </div>
        </div>
      );
    }

    // 작성 폼 컴포넌트
    function InvoiceForm({ kind, myCompany, counterparties, onSave, onCancel }) {
      const [buyer, setBuyer] = useState(counterparties[0]);
      const [itemDesc, setItemDesc] = useState('');
      const [qty, setQty] = useState(1);
      const [unitPrice, setUnitPrice] = useState(0);

      const supply = qty * unitPrice;
      const tax = Math.round(supply * 0.1);
      const grand = supply + tax;

      const handleSubmit = () => {
        if (!itemDesc.trim()) { alert('품목명을 입력해 주세요.'); return; }
        const newInvoice = {
          id: `inv-${Date.now()}`,
          manageNumber: `20261022-41000001-${Math.floor(10000000 + Math.random() * 90000000)}`,
          type: 'general',
          kind,
          writeDate: new Date().toISOString().slice(0, 10),
          supplier: kind === 'sales' ? myCompany : buyer,
          buyer: kind === 'sales' ? buyer : myCompany,
          items: [{ id: '1', date: '10-22', name: itemDesc, spec: '', qty, unitPrice, supplyAmount: supply, taxAmount: tax, remark: '' }],
          totalSupplyAmount: supply,
          totalTaxAmount: tax,
          grandTotal: grand,
          cash: 0, check: 0, promissoryNote: 0, receivable: grand,
          purpose: 'claim',
          status: 'issued',
        };
        onSave(newInvoice);
      };

      return (
        <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-2xs space-y-6 max-w-3xl mx-auto">
          <div className="flex justify-between items-center pb-4 border-b border-slate-200">
            <h2 className="text-lg font-bold text-slate-900">
              {kind === 'sales' ? '매출 세금계산서 작성' : '매입 세금계산서 등록'}
            </h2>
            <button onClick={onCancel} className="text-slate-400 hover:text-slate-600 cursor-pointer">닫기</button>
          </div>

          <div className="grid grid-cols-2 gap-4 text-xs">
            <div>
              <label className="block text-slate-500 mb-1 font-semibold">거래처 선택</label>
              <select onChange={e => setBuyer(counterparties.find(c => c.id === e.target.value))} className="w-full p-2 border border-slate-300 rounded-lg">
                {counterparties.map(c => <option key={c.id} value={c.id}>{c.companyName} ({c.bizNumber})</option>)}
              </select>
            </div>
            <div>
              <label className="block text-slate-500 mb-1 font-semibold">작성일자</label>
              <input type="date" defaultValue="2026-10-22" className="w-full p-2 border border-slate-300 rounded-lg" />
            </div>
          </div>

          <div className="space-y-3 text-xs">
            <h3 className="font-bold text-slate-800">품목 정보</h3>
            <div className="grid grid-cols-4 gap-3">
              <div className="col-span-2">
                <label className="block text-slate-500 mb-1">품목명</label>
                <input value={itemDesc} onChange={e => setItemDesc(e.target.value)} placeholder="예: 유지보수 컨설팅 용역" className="w-full p-2 border border-slate-300 rounded-lg" />
              </div>
              <div>
                <label className="block text-slate-500 mb-1">수량</label>
                <input type="number" value={qty} onChange={e => setQty(Number(e.target.value))} className="w-full p-2 border border-slate-300 rounded-lg font-mono text-center" />
              </div>
              <div>
                <label className="block text-slate-500 mb-1">단가 (원)</label>
                <input type="number" value={unitPrice} onChange={e => setUnitPrice(Number(e.target.value))} className="w-full p-2 border border-slate-300 rounded-lg font-mono text-right" />
              </div>
            </div>
          </div>

          <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
            <div>공급가액: <strong className="font-mono text-sm ml-1">₩ {formatCurrency(supply)}</strong></div>
            <div>세액 (10%): <strong className="font-mono text-sm ml-1 text-red-600">₩ {formatCurrency(tax)}</strong></div>
            <div>총 합계금액: <strong className="font-mono text-base ml-1 text-blue-700">₩ {formatCurrency(grand)}</strong></div>
          </div>

          <div className="flex justify-end gap-2 pt-2">
            <button onClick={onCancel} className="px-4 py-2 border border-slate-300 rounded-lg text-xs font-semibold cursor-pointer">취소</button>
            <button onClick={handleSubmit} className="px-5 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-bold cursor-pointer">발행 및 저장</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
