    const numberToKorean = (num) => {
      if (!num || isNaN(num) || num <= 0) return '영 원정';
      const units = ['', '만', '억', '조'];
      const smallUnits = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
      const posUnits = ['', '십', '백', '천'];
      let result = '';
      let unitIdx = 0;
      let temp = Math.floor(num);

      while (temp > 0) {
        const part = temp % 10000;
        if (part > 0) {
          let partStr = '';
          const pStr = part.toString().padStart(4, '0');
          for (let i = 0; i < 4; i++) {
            const digit = parseInt(pStr[i]);
            if (digit > 0) {
              partStr += (digit === 1 && i < 3 && part > 9 ? '' : smallUnits[digit]) + posUnits[3 - i];
            }
          }
          result = partStr + units[unitIdx] + ' ' + result;
        }
        temp = Math.floor(temp / 10000);
        unitIdx++;
      }
      return result.trim() + ' 원정';
    };

    function SalaryDetailCalculator() {
      const [salaryType, setSalaryType] = useState('year');
      const [amount, setAmount] = useState(48000000);
      const [nonTax, setNonTax] = useState(200000);
      const [familyCount, setFamilyCount] = useState(1);
      const [childrenCount, setChildrenCount] = useState(0);

      const monthlyGross = salaryType === 'year' ? Math.floor(amount / 12) : amount;
      const taxable = Math.max(0, monthlyGross - nonTax);

      const np = Math.floor(Math.min(taxable, 6170000) * 0.045);
      const hi = Math.floor(taxable * 0.03545);
      const lt = Math.floor(hi * 0.1295);
      const ei = Math.floor(taxable * 0.009);

      let it = Math.floor(taxable * 0.05);
      if (familyCount > 1) it = Math.max(0, it - (familyCount - 1) * 20000);
      if (childrenCount > 0) it = Math.max(0, it - childrenCount * 15000);
      const lit = Math.floor(it * 0.1);

      const totalDeduction = np + hi + lt + ei + it + lit;
      const netPay = monthlyGross - totalDeduction;

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between pb-4 border-b border-slate-100">
            <div>
              <h3 className="text-lg font-bold text-slate-900">2026년 연봉/월급 실수령액 정밀 계산</h3>
              <p className="text-xs text-slate-500">부양가족 및 2026년 최신 4대보험 요율을 정밀 반영한 결과입니다.</p>
            </div>
            <div className="flex gap-1 bg-slate-100 p-1 rounded-xl">
              <button onClick={() => setSalaryType('year')} className={`px-3 py-1 text-xs font-bold rounded-lg ${salaryType === 'year' ? 'bg-white text-sky-700 shadow-sm' : 'text-slate-600'}`}>연봉 기준</button>
              <button onClick={() => setSalaryType('month')} className={`px-3 py-1 text-xs font-bold rounded-lg ${salaryType === 'month' ? 'bg-white text-sky-700 shadow-sm' : 'text-slate-600'}`}>월급 기준</button>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div className="space-y-4">
              <div>
                <label className="text-xs font-semibold text-slate-700">{salaryType === 'year' ? '희망 연봉 (세전)' : '월 기본급 (세전)'}</label>
                <div className="relative mt-1">
                  <input
                    type="number"
                    step="100000"
                    value={amount}
                    onChange={e => setAmount(Number(e.target.value))}
                    className="w-full px-4 py-2.5 border rounded-xl font-bold text-slate-900 focus:ring-2 focus:ring-sky-500"
                  />
                  <span className="absolute right-4 top-2.5 text-xs text-slate-400">원</span>
                </div>
              </div>

              <div className="grid grid-cols-3 gap-3">
                <div>
                  <label className="text-xs font-semibold text-slate-700">월 비과세액</label>
                  <input type="number" value={nonTax} onChange={e => setNonTax(Number(e.target.value))} className="mt-1 w-full px-3 py-2 border rounded-xl text-xs" />
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-700">부양가족수(본인포함)</label>
                  <input type="number" min="1" value={familyCount} onChange={e => setFamilyCount(Number(e.target.value))} className="mt-1 w-full px-3 py-2 border rounded-xl text-xs" />
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-700">20세 이하 자녀수</label>
                  <input type="number" min="0" value={childrenCount} onChange={e => setChildrenCount(Number(e.target.value))} className="mt-1 w-full px-3 py-2 border rounded-xl text-xs" />
                </div>
              </div>
            </div>

            <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-4">
              <div className="flex justify-between items-baseline pb-3 border-b border-slate-200">
                <span className="text-xs font-bold text-slate-500">예상 월 실수령액</span>
                <span className="text-2xl font-extrabold text-sky-700">{netPay.toLocaleString()}원</span>
              </div>
              <div className="space-y-1.5 text-xs">
                <div className="flex justify-between text-slate-600"><span>월 환산 총 급여:</span><strong>{monthlyGross.toLocaleString()}원</strong></div>
                <div className="flex justify-between text-slate-600"><span>국민연금:</span><span>{np.toLocaleString()}원</span></div>
                <div className="flex justify-between text-slate-600"><span>건강보험:</span><span>{hi.toLocaleString()}원</span></div>

                <div className="flex justify-between text-slate-600"><span>근로소득세 + 지방세:</span><span>{(it + lit).toLocaleString()}원</span></div>

                </div>
              </div>
            </div>
          </div>
        </div>

    function TransferTaxCalculator() {
      const [salePrice, setSalePrice] = useState(900000000);
      const [buyPrice, setBuyPrice] = useState(600000000);
      const [expense, setExpense] = useState(20000000);
      const [holdingYears, setHoldingYears] = useState(5);

      const gain = Math.max(0, salePrice - buyPrice - expense);
      const deductionRate = Math.min(0.8, holdingYears * 0.04);
      const specialDeduction = Math.floor(gain * deductionRate);
      const taxableGain = Math.max(0, gain - specialDeduction - 2500000);
      const tax = Math.floor(taxableGain * 0.35);

      return (
        <div className="space-y-6">
          <div className="pb-4 border-b border-slate-100">
            <h3 className="text-lg font-bold text-slate-900">양도소득세 간이 계산기</h3>

              </div>

                </div>
              </div>
            </div>
            <div className="bg-purple-50 p-6 rounded-2xl border border-purple-200 space-y-3">
              <span className="text-xs font-bold text-purple-900 uppercase">예상 양도소득세 (지방세 별도)</span>
              <div className="text-3xl font-extrabold text-purple-800">{tax.toLocaleString()}원</div>
              <div className="text-xs text-purple-900/80 space-y-1 pt-3 border-t border-purple-200">
                <div>양도차익: {gain.toLocaleString()}원</div>
                <div>장특공제: -{specialDeduction.toLocaleString()}원</div>
                <div>기본공제: -2,500,000원</div>
              </div>
            </div>
          </div>
        </div>
      );
    }
